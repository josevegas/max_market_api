[pytest]
testpaths = tests
# Pone la raíz del proyecto en sys.path. `python -m pytest` lo hace solo, pero
# `pytest` a secas no: sin esto, `from tests.conftest import ...` no resuelve.
pythonpath = .
# `auto`: los tests async no necesitan decorador. Toda la app es async.
asyncio_mode = auto
# Un solo event loop para toda la sesión. El engine de la app se crea al
# importarla y su pool de asyncpg queda atado al loop donde nació: con un loop
# por test, la segunda consulta falla con "attached to a different loop".
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
filterwarnings =
    ignore::DeprecationWarning
